# Electron Builder configuration for packaging the Gr8r Time Tracker desktop client.
appId: com.gr8r.timetracker
productName: Gr8r Time Tracker
copyright: Copyright © 2026 Gr8r

directories:
  output: release
  buildResources: resources

files:
  - dist-electron/**/*
  - .next/**/*
  - public/**/*
  - package.json

extraResources:
  - from: resources
    to: resources

mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  icon: resources/icons/icon.icns

win:
  target:
    - nsis
  icon: resources/icons/icon.ico

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: resources/icons

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: generic
  url: https://updates.gr8r.com/timetracker/
