# Electron Builder configuration for packaging the Gr8r Time Tracker desktop client.
appId: com.gr8r.timetracker
productName: Gr8r Time Tracker
copyright: Copyright © 2026 Gr8r

directories:
  output: release
  buildResources: resources

files:
  - dist-electron/**/*
  - .next/**/*
  - public/**/*
  - package.json

extraResources:
  - from: resources
    to: resources

mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  icon: resources/icons/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSAppleEventsUsageDescription: Gr8r Time Tracker needs Automation access to detect which application you are using while the timer is running.
    NSScreenCaptureDescription: Gr8r Time Tracker needs Screen Recording permission to capture work screenshots while the timer is running.
    LSApplicationCategoryType: public.app-category.productivity

win:
  target:
    - nsis
  icon: resources/icons/icon.ico

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: resources/icons

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: generic
  url: https://updates.gr8r.com/timetracker/
