# Electron Builder configuration for packaging the Gr8r Time Tracker desktop client.
appId: com.gr8r.timetracker
productName: Gr8r Time Tracker
copyright: Copyright © 2026 Gr8r
author: Nazmul Rahman

directories:
  output: release
  buildResources: resources

files:
  - dist-electron/**/*
  - out/**/*
  - public/**/*
  - package.json

asarUnpack:
  - "**/*.{node,dylib,so,dll}"
  - "**/better-sqlite3/**"

extraResources:
  - from: resources
    to: resources

afterPack: ./scripts/after-pack-mac-icon.cjs

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  icon: resources/icons/icon.icns
  identity: "Md shamir Rahman (7BK872D6A5)"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    CFBundleIconFile: icon.icns
    NSAppleEventsUsageDescription: Gr8r Time Tracker needs Automation access to detect which application you are using while the timer is running.
    NSScreenCaptureUsageDescription: Gr8r Time Tracker needs Screen Recording permission to capture work screenshots while the timer is running.
    NSUserNotificationsUsageDescription: Gr8r Time Tracker sends a notification when the timer pauses because you were idle.
    LSApplicationCategoryType: public.app-category.productivity

dmg:
  icon: resources/icons/icon.icns
  iconSize: 80

win:
  target:
    - nsis
  icon: resources/icons/icon.ico

linux:
  target:
    - AppImage
    - deb
  category: Office
  icon: resources/icons

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: Nazmul1011
  repo: TimeTrackerDesktopApp
